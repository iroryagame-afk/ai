<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif}</style><rect width="1080" height="1920" fill="#f4eedf"/><rect x="54" y="54" width="972" height="1812" rx="28" fill="#fffdf7" stroke="#d8cdb8" stroke-width="2"/>
  <text x="92" y="118" fill="#9e3f32" font-size="27" font-weight="700">NO.3 · 存储设备</text>
  <text x="92" y="176" fill="#17233b" font-size="52" font-weight="800">Applied Materials · AMAT</text>
  <text x="92" y="216" fill="#657083" font-size="24">FY2026 Q3｜8月14日 04:30 SGT｜盘后</text><rect x="80" y="250" width="293.3333333333333" height="150" rx="18" fill="#f0eadc"/><text x="104" y="292" fill="#657083" font-size="21">公司收入指引</text><text x="104" y="345" fill="#17233b" font-size="34" font-weight="800">$8.95B ±0.50</text><text x="104" y="380" fill="#657083" font-size="18">中点 $8.95B</text><rect x="393.3333333333333" y="250" width="293.3333333333333" height="150" rx="18" fill="#f0eadc"/><text x="417.3333333333333" y="292" fill="#657083" font-size="21">市场收入预期</text><text x="417.3333333333333" y="345" fill="#17233b" font-size="34" font-weight="800">约 $9.01B</text><text x="417.3333333333333" y="380" fill="#657083" font-size="18">公开一致预期</text><rect x="706.6666666666666" y="250" width="293.3333333333333" height="150" rx="18" fill="#f0eadc"/><text x="730.6666666666666" y="292" fill="#657083" font-size="21">非GAAP EPS指引</text><text x="730.6666666666666" y="345" fill="#17233b" font-size="34" font-weight="800">$3.36 ±0.20</text><text x="730.6666666666666" y="380" fill="#657083" font-size="18">市场约 $3.38</text><rect x="80" y="445" width="920" height="236" rx="18" fill="#fffaf0" stroke="#d8cdb8"/><text x="108" y="487" fill="#9e3f32" font-size="27" font-weight="800">这次真正看什么</text><circle cx="116" cy="521" r="5" fill="#a47b2c"/><text x="136" y="529" fill="#17233b" font-size="22">DRAM/HBM设备需求是否继续强于晶圆厂整体增速</text><circle cx="116" cy="560" r="5" fill="#a47b2c"/><text x="136" y="568" fill="#17233b" font-size="22">先进封装、背面供电与GAA收入兑现节奏</text><circle cx="116" cy="599" r="5" fill="#a47b2c"/><text x="136" y="607" fill="#17233b" font-size="22">中国收入与出口管制变化对订单、毛利率的影响</text><circle cx="116" cy="638" r="5" fill="#a47b2c"/><text x="136" y="646" fill="#17233b" font-size="22">下一季与CY2026 WFE判断是否继续上修</text><rect x="80" y="699" width="920" height="197" rx="18" fill="#fffaf0" stroke="#d8cdb8"/><text x="108" y="741" fill="#2f6b52" font-size="27" font-weight="800">A股映射</text><circle cx="116" cy="775" r="5" fill="#2f6b52"/><text x="136" y="783" fill="#17233b" font-size="22">核心设备：北方华创、中微公司、拓荆科技</text><circle cx="116" cy="814" r="5" fill="#2f6b52"/><text x="136" y="822" fill="#17233b" font-size="22">清洗/抛光：盛美上海、华海清科；零部件：富创精密</text><circle cx="116" cy="853" r="5" fill="#2f6b52"/><text x="136" y="861" fill="#17233b" font-size="22">存储景气旁证：兆易创新、江波龙、佰维存储、德明利</text><rect x="80" y="914" width="920" height="236" rx="18" fill="#fffaf0" stroke="#d8cdb8"/><text x="108" y="956" fill="#9e3f32" font-size="27" font-weight="800">判定与纪律</text><circle cx="116" cy="990" r="5" fill="#a47b2c"/><text x="136" y="998" fill="#17233b" font-size="22">强化：收入超过约$9.01B且下一季/存储判断上修</text><circle cx="116" cy="1029" r="5" fill="#a47b2c"/><text x="136" y="1037" fill="#17233b" font-size="22">弱化：本季达标但订单、毛利率或中国收入明显走弱</text><circle cx="116" cy="1068" r="5" fill="#a47b2c"/><text x="136" y="1076" fill="#17233b" font-size="22">证伪：DRAM/HBM设备增速拐头、客户Capex转弱</text><circle cx="116" cy="1107" r="5" fill="#a47b2c"/><text x="136" y="1115" fill="#17233b" font-size="22">不追涨：EPS靠税率/回购，核心设备与指引没有改善</text><line x1="80" y1="1778" x2="1000" y2="1778" stroke="#d8cdb8"/><text x="80" y="1818" fill="#657083" font-size="18">来源：Applied Materials IR；公开一致预期快照｜GAAP与non-GAAP严格分列</text><text x="1000" y="1818" text-anchor="end" fill="#a47b2c" font-size="20" font-weight="700">CSNPK · ISSUE #6</text></svg>