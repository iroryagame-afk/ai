16" cy="716" r="5" fill="#a47b2c"/><text x="136" y="724" fill="#17233b" font-size="22">8/14 04:30｜AMAT FY26 Q3：DRAM/HBM、先进封装、下一季指引</text><rect x="80" y="777" width="920" height="236" rx="18" fill="#fffaf0" stroke="#d8cdb8"/><text x="108" y="819" fill="#2f6b52" font-size="27" font-weight="800">持仓映射</text><circle cx="116" cy="853" r="5" fill="#2f6b52"/><text x="136" y="861" fill="#17233b" font-size="22">光通信：中际旭创 / 新易盛 / 天孚通信 / 源杰科技 / 罗博特科</text><circle cx="116" cy="892" r="5" fill="#2f6b52"/><text x="136" y="900" fill="#17233b" font-size="22">存储设备：北方华创 / 中微公司 / 拓荆科技 / 盛美上海 / 华海清科</text><circle cx="116" cy="931" r="5" fill="#2f6b52"/><text x="136" y="939" fill="#17233b" font-size="22">AI 服务器：工业富联 / 浪潮信息；电力散热：英维克 / 科华数据</text><circle cx="116" cy="970" r="5" fill="#2f6b52"/><text x="136" y="978" fill="#17233b" font-size="22">AI 应用：腾讯结果重点验证云与广告变现，对金山办公偏间接</text><rect x="80" y="1031" width="920" height="197" rx="18" fill="#fffaf0" stroke="#d8cdb8"/><text x="108" y="1073" fill="#9e3f32" font-size="27" font-weight="800">交易纪律</text><circle cx="116" cy="1107" r="5" fill="#a47b2c"/><text x="136" y="1115" fill="#17233b" font-size="22">好财报不等于可追：次日高开需看指引上修与成交承接</text><circle cx="116" cy="1146" r="5" fill="#a47b2c"/><text x="136" y="1154" fill="#17233b" font-size="22">实际值必须与同口径一致预期比较；同比增长不等于超预期</text><circle cx="116" cy="1185" r="5" fill="#a47b2c"/><text x="136" y="1193" fill="#17233b" font-size="22">若收入好但现金流/毛利率恶化，优先视为“量增利弱”</text><line x1="80" y1="1778" x2="1000" y2="1778" stroke="#d8cdb8"/><text x="80" y="1818" fill="#657083" font-size="18">Freeze: 2026-08-08 13:45 SGT｜官方 IR 优先；一致预期为公开市场快照</text><text x="1000" y="1818" text-anchor="end" fill="#a47b2c" font-size="20" font-weight="700">CSNPK · ISSUE #6</text></svg>