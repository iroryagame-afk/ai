<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif}</style><rect width="1080" height="1920" fill="#f4eedf"/><rect x="54" y="54" width="972" height="1812" rx="28" fill="#fffdf7" stroke="#d8cdb8" stroke-width="2"/>
  <text x="92" y="118" fill="#9e3f32" font-size="27" font-weight="700">NO.2 · AI 算力需求</text>
  <text x="92" y="176" fill="#17233b" font-size="52" font-weight="800">CoreWeave · CRWV</text>
  <text x="92" y="216" fill="#657083" font-size="24">2026 Q2｜8月12日 05:00 SGT｜盘后</text><rect x="80" y="250" width="293.3333333333333" height="150" rx="18" fill="#f0eadc"/><text x="104" y="292" fill="#657083" font-size="21">市场收入预期</text><text x="104" y="345" fill="#17233b" font-size="34" font-weight="800">约 $2.56B</text><text x="104" y="380" fill="#657083" font-size="18">公开市场快照</text><rect x="393.3333333333333" y="250" width="293.3333333333333" height="150" rx="18" fill="#f0eadc"/><text x="417.3333333333333" y="292" fill="#657083" font-size="21">市场每股亏损</text><text x="417.3333333333333" y="345" fill="#17233b" font-size="34" font-weight="800">约 $1.40</text><text x="417.3333333333333" y="380" fill="#657083" font-size="18">口径待财报核对</text><rect x="706.6666666666666" y="250" width="293.3333333333333" height="150" rx="18" fill="#f0eadc"/><text x="730.6666666666666" y="292" fill="#657083" font-size="21">Q1期末积压</text><text x="730.6666666666666" y="345" fill="#17233b" font-size="34" font-weight="800">$99.4B</text><text x="730.6666666666666" y="380" fill="#657083" font-size="18">公司披露</text><rect x="80" y="445" width="920" height="236" rx="18" fill="#fffaf0" stroke="#d8cdb8"/><text x="108" y="487" fill="#9e3f32" font-size="27" font-weight="800">这次真正看什么</text><circle cx="116" cy="521" r="5" fill="#a47b2c"/><text x="136" y="529" fill="#17233b" font-size="22">GPU 容量上线是否按期，数据中心延迟有没有扩大</text><circle cx="116" cy="560" r="5" fill="#a47b2c"/><text x="136" y="568" fill="#17233b" font-size="22">收入增长能否转化为调整后EBITDA与经营现金流</text><circle cx="116" cy="599" r="5" fill="#a47b2c"/><text x="136" y="607" fill="#17233b" font-size="22">Capex、融资与利息负担是否继续吞噬股东价值</text><circle cx="116" cy="638" r="5" fill="#a47b2c"/><text x="136" y="646" fill="#17233b" font-size="22">Meta / Nvidia 等大客户合同能否降低集中度与履约风险</text><rect x="80" y="699" width="920" height="197" rx="18" fill="#fffaf0" stroke="#d8cdb8"/><text x="108" y="741" fill="#2f6b52" font-size="27" font-weight="800">A股映射</text><circle cx="116" cy="775" r="5" fill="#2f6b52"/><text x="136" y="783" fill="#17233b" font-size="22">服务器：工业富联、浪潮信息、中科曙光</text><circle cx="116" cy="814" r="5" fill="#2f6b52"/><text x="136" y="822" fill="#17233b" font-size="22">电源与散热：英维克、科华数据及数据中心供配电链</text><circle cx="116" cy="853" r="5" fill="#2f6b52"/><text x="136" y="861" fill="#17233b" font-size="22">CRWV更像“算力租赁需求+交付能力”验证，不等于芯片销量单点验证</text><rect x="80" y="914" width="920" height="236" rx="18" fill="#fffaf0" stroke="#d8cdb8"/><text x="108" y="956" fill="#9e3f32" font-size="27" font-weight="800">判定与纪律</text><circle cx="116" cy="990" r="5" fill="#a47b2c"/><text x="136" y="998" fill="#17233b" font-size="22">强化：收入/积压上升且上线、电力与现金流同时改善</text><circle cx="116" cy="1029" r="5" fill="#a47b2c"/><text x="136" y="1037" fill="#17233b" font-size="22">弱化：订单强但交付延迟，Capex继续超预算</text><circle cx="116" cy="1068" r="5" fill="#a47b2c"/><text x="136" y="1076" fill="#17233b" font-size="22">证伪：客户延期、融资压力上升或利润率显著低于路径</text><circle cx="116" cy="1107" r="5" fill="#a47b2c"/><text x="136" y="1115" fill="#17233b" font-size="22">不追涨：只看收入翻倍，忽略债务、利息和自由现金流</text><line x1="80" y1="1778" x2="1000" y2="1778" stroke="#d8cdb8"/><text x="80" y="1818" fill="#657083" font-size="18">来源：CoreWeave IR；公开市场预期｜高增长与高资本强度必须同时评估</text><text x="1000" y="1818" text-anchor="end" fill="#a47b2c" font-size="20" font-weight="700">CSNPK · ISSUE #6</text></svg>