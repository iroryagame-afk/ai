<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif}</style><rect width="1080" height="1920" fill="#f4eedf"/><rect x="54" y="54" width="972" height="1812" rx="28" fill="#fffdf7" stroke="#d8cdb8" stroke-width="2"/>
  <text x="92" y="118" fill="#9e3f32" font-size="27" font-weight="700">NO.1 · 光通信</text>
  <text x="92" y="176" fill="#17233b" font-size="52" font-weight="800">Lumentum · LITE</text>
  <text x="92" y="216" fill="#657083" font-size="24">FY2026 Q4｜8月12日 05:00 SGT｜盘后</text><rect x="80" y="250" width="293.3333333333333" height="150" rx="18" fill="#f0eadc"/><text x="104" y="292" fill="#657083" font-size="21">市场收入预期</text><text x="104" y="345" fill="#17233b" font-size="34" font-weight="800">$988.56M</text><text x="104" y="380" fill="#657083" font-size="18">Zacks consensus</text><rect x="393.3333333333333" y="250" width="293.3333333333333" height="150" rx="18" fill="#f0eadc"/><text x="417.3333333333333" y="292" fill="#657083" font-size="21">上季收入</text><text x="417.3333333333333" y="345" fill="#17233b" font-size="34" font-weight="800">$808.4M</text><text x="417.3333333333333" y="380" fill="#657083" font-size="18">公司披露</text><rect x="706.6666666666666" y="250" width="293.3333333333333" height="150" rx="18" fill="#f0eadc"/><text x="730.6666666666666" y="292" fill="#657083" font-size="21">上季非GAAP GM</text><text x="730.6666666666666" y="345" fill="#17233b" font-size="34" font-weight="800">47.9%</text><text x="730.6666666666666" y="380" fill="#657083" font-size="18">公司披露</text><rect x="80" y="445" width="920" height="236" rx="18" fill="#fffaf0" stroke="#d8cdb8"/><text x="108" y="487" fill="#9e3f32" font-size="27" font-weight="800">这次真正看什么</text><circle cx="116" cy="521" r="5" fill="#a47b2c"/><text x="136" y="529" fill="#17233b" font-size="22">1.6T / 800G 数据中心器件增速与客户扩张</text><circle cx="116" cy="560" r="5" fill="#a47b2c"/><text x="136" y="568" fill="#17233b" font-size="22">InP 晶圆、激光芯片供给能否支持订单兑现</text><circle cx="116" cy="599" r="5" fill="#a47b2c"/><text x="136" y="607" fill="#17233b" font-size="22">高增量下毛利率是否继续改善，而非只靠收入放量</text><circle cx="116" cy="638" r="5" fill="#a47b2c"/><text x="136" y="646" fill="#17233b" font-size="22">下一季指引能否证明AI光需求延续至2027</text><rect x="80" y="699" width="920" height="197" rx="18" fill="#fffaf0" stroke="#d8cdb8"/><text x="108" y="741" fill="#2f6b52" font-size="27" font-weight="800">A股映射</text><circle cx="116" cy="775" r="5" fill="#2f6b52"/><text x="136" y="783" fill="#17233b" font-size="22">需求强化：中际旭创、新易盛、天孚通信</text><circle cx="116" cy="814" r="5" fill="#2f6b52"/><text x="136" y="822" fill="#17233b" font-size="22">上游弹性：源杰科技、光库科技；自动化：罗博特科</text><circle cx="116" cy="853" r="5" fill="#2f6b52"/><text x="136" y="861" fill="#17233b" font-size="22">注意：LITE既是需求温度计，也与部分国内器件厂存在竞争</text><rect x="80" y="914" width="920" height="236" rx="18" fill="#fffaf0" stroke="#d8cdb8"/><text x="108" y="956" fill="#9e3f32" font-size="27" font-weight="800">判定与纪律</text><circle cx="116" cy="990" r="5" fill="#a47b2c"/><text x="136" y="998" fill="#17233b" font-size="22">强化：收入超过预期且毛利率/指引同步上修</text><circle cx="116" cy="1029" r="5" fill="#a47b2c"/><text x="136" y="1037" fill="#17233b" font-size="22">弱化：收入达标但毛利率下滑，或供给约束拖累交付</text><circle cx="116" cy="1068" r="5" fill="#a47b2c"/><text x="136" y="1076" fill="#17233b" font-size="22">证伪：数据中心增长明显减速、订单重复或指引低于市场</text><circle cx="116" cy="1107" r="5" fill="#a47b2c"/><text x="136" y="1115" fill="#17233b" font-size="22">不追涨：仅靠同比高增、没有下一季上修，或高开后量价背离</text><line x1="80" y1="1778" x2="1000" y2="1778" stroke="#d8cdb8"/><text x="80" y="1818" fill="#657083" font-size="18">来源：Lumentum IR；Zacks公开一致预期｜口径：收入与非GAAP利润率分列</text><text x="1000" y="1818" text-anchor="end" fill="#a47b2c" font-size="20" font-weight="700">CSNPK · ISSUE #6</text></svg>