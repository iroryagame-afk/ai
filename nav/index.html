<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <title>CSN 研究与工具汇总</title>
  <style>
    :root {
      --bg:#f3f6f8; --panel:#fff; --text:#172026; --muted:#68737d;
      --line:#d9dee3; --green:#0f766e; --green-bg:#d9f3ee;
      --blue:#2563eb; --blue-bg:#dbeafe; --amber:#b45309; --amber-bg:#fef3c7;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; color:var(--text); line-height:1.5;
      background:linear-gradient(180deg,#e8f3f5 0,#f7f9fb 260px,var(--bg) 100%);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    }
    main { width:min(1040px,100%); margin:0 auto; padding:18px 14px; }
    header {
      display:grid; gap:9px; padding:20px; margin-bottom:12px; background:var(--panel);
      border:1px solid var(--line); border-left:5px solid var(--green); border-radius:12px;
      box-shadow:0 10px 26px rgba(23,32,38,.06);
    }
    h1 { margin:0; font-size:clamp(24px,5vw,34px); line-height:1.15; }
    .sub { color:var(--muted); font-size:14px; }
    .skill-section { margin:0 0 18px; padding:16px; border:1px solid #cbd5e1; border-radius:12px; background:#fff; box-shadow:0 10px 26px rgba(23,32,38,.05); }
    .skill-head { display:flex; align-items:end; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .skill-head h2 { margin:0; font-size:19px; }
    .skill-head p { margin:3px 0 0; color:var(--muted); font-size:12px; }
    .skill-count { color:#6d28d9; font-size:13px; font-weight:900; white-space:nowrap; }
    .skill-search { margin-bottom:12px; background:#faf7ff; border-color:#ddd6fe; }
    .skill-groups { display:grid; gap:14px; }
    .skill-group h3 { margin:0 0 7px; color:#475569; font-size:13px; }
    .skill-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .skill-card { display:grid; gap:7px; min-height:128px; padding:13px; border:1px solid #e2e8f0; border-radius:10px; background:#fbfcfe; }
    .skill-card:hover { border-color:#c4b5fd; background:#faf7ff; }
    .skill-card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
    .skill-card strong { color:#312e81; font-size:13px; overflow-wrap:anywhere; }
    .skill-card p { margin:0; color:#64748b; font-size:11px; line-height:1.55; }
    .skill-status { flex:0 0 auto; padding:2px 6px; border-radius:999px; background:#f1f5f9; color:#64748b; font-size:9px; font-weight:900; }
    .skill-status.public { background:#ede9fe; color:#6d28d9; }
    .skill-card a { width:max-content; margin-top:auto; color:#6d28d9; font-size:11px; font-weight:900; text-decoration:none; }
    .skill-card a:hover { text-decoration:underline; }
    .tools {
      position:sticky; top:0; z-index:5; display:grid; gap:9px; padding:10px 0;
      background:rgba(243,246,248,.94); backdrop-filter:blur(10px);
    }
    input {
      width:100%; min-height:44px; padding:9px 12px; border:1px solid var(--line);
      border-radius:9px; background:#fff; color:var(--text); font:inherit;
    }
    .filters { display:flex; flex-wrap:wrap; gap:7px; }
    .filter {
      min-height:36px; padding:6px 12px; border:1px solid var(--line); border-radius:999px;
      background:#fff; color:var(--muted); font:inherit; font-size:13px; font-weight:800; cursor:pointer;
    }
    .filter.active { border-color:var(--green); background:var(--green); color:#fff; }
    .count { margin:3px 0 10px; color:var(--muted); font-size:13px; }
    .count strong { color:var(--green); font-size:17px; }
    .groups { display:grid; gap:18px; }
    .group h2 { margin:0 0 8px; font-size:18px; }
    .list { display:grid; gap:8px; }
    .row {
      display:grid; grid-template-columns:104px minmax(220px,1fr) 1.6fr; gap:12px;
      align-items:start; padding:13px; background:var(--panel); border:1px solid var(--line);
      border-radius:10px; box-shadow:0 6px 16px rgba(23,32,38,.04);
    }
    .date { color:var(--green); font-weight:900; white-space:nowrap; }
    .title a { color:var(--text); font-weight:900; text-decoration:none; }
    .title a:hover { color:var(--blue); text-decoration:underline; }
    .meta { display:grid; gap:7px; }
    .category { color:var(--blue); font-size:12px; font-weight:850; }
    .tags { display:flex; flex-wrap:wrap; gap:6px; }
    .tag {
      display:inline-flex; align-items:center; min-height:24px; padding:2px 8px;
      border-radius:999px; background:var(--blue-bg); color:var(--blue);
      font-size:12px; font-weight:800; overflow-wrap:anywhere;
    }
    .tag:nth-child(3n+1) { background:var(--green-bg); color:var(--green); }
    .tag:nth-child(3n) { background:var(--amber-bg); color:var(--amber); }
    .empty {
      display:none; padding:20px; text-align:center; color:var(--muted); background:#fff;
      border:1px dashed #cbd5e1; border-radius:10px; font-weight:800;
    }
    footer { margin:18px 0 4px; color:var(--muted); font-size:12px; line-height:1.7; }
    @media (max-width:680px) {
      main { padding:10px; }
      header { padding:16px; }
      .skill-head { align-items:flex-start; flex-direction:column; }
      .skill-grid { grid-template-columns:1fr; }
      .row { grid-template-columns:1fr; gap:7px; }
      .title a { font-size:17px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>CSN 研究与工具汇总</h1>
    <div class="sub">统一查看自建 Skill 清单，以及已公开的行业与主题策略研究。</div>
  </header>

  <section class="skill-section" id="skills" aria-labelledby="skillsTitle">
    <div class="skill-head"><div><h2 id="skillsTitle">我的 Skills</h2><p>来自“整理 skill 名单”对话；GitHub 标签可直接打开公开源码。</p></div><span class="skill-count" id="skillCount">读取中</span></div>
    <input class="skill-search" id="skillSearch" type="search" placeholder="搜索 Skill 名称、用途或分类……" autocomplete="off">
    <div class="skill-groups" id="skillGroups"></div>
  </section>

  <section class="tools" aria-label="报告筛选">
    <input id="searchInput" type="search" placeholder="搜索报告、公司或标签……" autocomplete="off" />
    <div class="filters" aria-label="报告分类">
      <button class="filter active" type="button" data-category="全部">全部</button>
      <button class="filter" type="button" data-category="行业研究">行业研究</button>
      <button class="filter" type="button" data-category="主题策略">主题策略</button>
    </div>
  </section>

  <p class="count">当前显示 <strong id="resultCount">0</strong> 份报告</p>
  <section id="groups" class="groups" aria-live="polite"></section>
  <div id="empty" class="empty">没有匹配到报告。</div>

  <footer>Skill 模块区分 GitHub 已公开与仅本地使用；研报区仅收录已公开的非每日更新报告。</footer>
</main>

<script>
  const CATEGORY_ORDER = ["主题策略", "行业研究"];
  const SKILL_CATEGORY_ORDER = ["择时与交易", "回撤与形态", "组合与主线", "财报与发布", "写作与维护"];
  let entries = [];
  let skillEntries = [];
  let activeCategory = "全部";

  const groups = document.querySelector("#groups");
  const empty = document.querySelector("#empty");
  const searchInput = document.querySelector("#searchInput");
  const resultCount = document.querySelector("#resultCount");
  const filters = [...document.querySelectorAll(".filter")];
  const skillSearch = document.querySelector("#skillSearch");
  const skillGroups = document.querySelector("#skillGroups");
  const skillCount = document.querySelector("#skillCount");

  function escapeHtml(value) {
    return String(value).replace(/[&<>'"]/g, char => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;"
    })[char]);
  }

  function render() {
    const keyword = searchInput.value.trim().toLowerCase();
    const filtered = entries.filter(entry => {
      const categoryMatches = activeCategory === "全部" || entry.category === activeCategory;
      const text = [entry.date, entry.title, entry.category, ...entry.tags].join(" ").toLowerCase();
      return categoryMatches && (!keyword || text.includes(keyword));
    });

    groups.innerHTML = CATEGORY_ORDER.map(category => {
      const categoryEntries = filtered.filter(entry => entry.category === category);
      if (!categoryEntries.length) return "";
      const rows = categoryEntries.map(entry => `
        <article class="row">
          <div class="date">${escapeHtml(entry.date)}</div>
          <div class="title"><a href="${escapeHtml(entry.url)}">${escapeHtml(entry.title)}</a></div>
          <div class="meta">
            <div class="category">${escapeHtml(entry.category)}</div>
            <div class="tags">${entry.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>
          </div>
        </article>`).join("");
      return `<section class="group"><h2>${escapeHtml(category)} · ${categoryEntries.length}</h2><div class="list">${rows}</div></section>`;
    }).join("");

    resultCount.textContent = filtered.length;
    empty.textContent = "没有匹配到报告。";
    empty.style.display = filtered.length ? "none" : "block";
  }

  async function loadReports() {
    try {
      const response = await fetch("reports.json", { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      entries = await response.json();
      entries.sort((a, b) => b.date.localeCompare(a.date));
      render();
    } catch (error) {
      console.error("Failed to load report manifest", error);
      entries = [];
      groups.innerHTML = "";
      resultCount.textContent = "0";
      empty.textContent = "报告清单加载失败，请稍后刷新。";
      empty.style.display = "block";
    }
  }

  function renderSkills() {
    const keyword = skillSearch.value.trim().toLowerCase();
    const filtered = skillEntries.filter(entry =>
      !keyword || [entry.id, entry.name, entry.category, entry.description, entry.status].join(" ").toLowerCase().includes(keyword)
    );
    skillGroups.innerHTML = SKILL_CATEGORY_ORDER.map(category => {
      const items = filtered.filter(entry => entry.category === category);
      if (!items.length) return "";
      const cards = items.map(entry => `
        <article class="skill-card">
          <div class="skill-card-head"><strong>${escapeHtml(entry.name)}</strong><span class="skill-status ${entry.url ? "public" : ""}">${escapeHtml(entry.status)}</span></div>
          <p>${escapeHtml(entry.description)}</p>
          ${entry.url ? `<a href="${escapeHtml(entry.url)}" target="_blank" rel="noopener">查看源码 ↗</a>` : ""}
        </article>`).join("");
      return `<section class="skill-group"><h3>${escapeHtml(category)} · ${items.length}</h3><div class="skill-grid">${cards}</div></section>`;
    }).join("");
    skillCount.textContent = `${filtered.length} / ${skillEntries.length}`;
  }

  async function loadSkills() {
    try {
      const response = await fetch("skills.json", { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      skillEntries = await response.json();
      renderSkills();
    } catch (error) {
      console.error("Failed to load skill manifest", error);
      skillCount.textContent = "加载失败";
      skillGroups.innerHTML = '<div class="empty" style="display:block">Skill 清单加载失败，请稍后刷新。</div>';
    }
  }

  searchInput.addEventListener("input", render);
  filters.forEach(button => button.addEventListener("click", () => {
    activeCategory = button.dataset.category;
    filters.forEach(item => item.classList.toggle("active", item === button));
    render();
  }));
  skillSearch.addEventListener("input", renderSkills);
  loadSkills();
  loadReports();
</script>
</body>
</html>
