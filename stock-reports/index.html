<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>市场工具汇总</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #637083;
      --line: #d9e0ea;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --accent: #0f766e;
      --warn: #9a5b00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }
    main {
      width: min(960px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 40px 0 56px;
    }
    header {
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.15;
      letter-spacing: 0;
    }
    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 22px;
    }
    article {
      position: relative;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(23, 32, 51, 0.06);
    }
    h2 {
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: 0;
    }
    .icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      margin-bottom: 16px;
      border-radius: 12px;
      color: #063e39;
      background: #86efac;
    }
    article:nth-child(2) .icon { color: #172554; background: #7dd3fc; }
    .icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .kind {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .13em;
    }
    article:nth-child(2) .kind { color: #0369a1; }
    .score {
      margin: 0 0 12px;
      color: var(--warn);
      font-weight: 700;
    }
    .note {
      min-height: 78px;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }
    a:hover { text-decoration: underline; }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 7px 11px;
      border: 1px solid #b7d7d1;
      border-radius: 999px;
      background: #eefaf7;
      font-size: 14px;
    }
    footer {
      margin-top: 22px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>市场工具汇总</h1>
      <p class="sub">集中访问每日更新的美股研究仪表盘与风险直方图。</p>
    </header>

    <section class="grid" aria-label="报告列表">
      <article>
        <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 17l5-5 4 3 7-8"/><path d="M15 7h5v5"/><path d="M4 21h16"/></svg></div>
        <p class="kind">RS THRUST MONITOR</p>
        <h2>正在加速的领导者</h2>
        <p class="score">富途自选股 · 每日刷新</p>
        <p class="note">筛选相对强度领先、动能仍在加速的股票，支持代码搜索、自选分组、条件筛选和表头排序。</p>
        <div class="links">
          <a class="pill" href="../rs-thrust/">打开仪表盘 ↗</a>
        </div>
      </article>

      <article>
        <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20V10h4v10"/><path d="M10 20V4h4v16"/><path d="M16 20v-7h4v7"/><path d="M3 20h18"/></svg></div>
        <p class="kind">US WATCHLIST IV SKEW</p>
        <h2>美股 IV Skew 直方图</h2>
        <p class="score">期权偏斜 · 风险雷达</p>
        <p class="note">观察自选股期权偏斜的横截面分布，识别保护性需求、风险温度与异常偏斜区间。</p>
        <div class="links">
          <a class="pill" href="../us-skew/">打开直方图 ↗</a>
        </div>
      </article>
    </section>

    <footer>
      动态工具按各页面标注的数据日期更新，仅用于研究筛选，不构成投资建议。
    </footer>
  </main>
</body>
</html>
